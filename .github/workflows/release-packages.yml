name: release-packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version, for example 0.1.0-alpha.1'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          npm_tag="latest"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            case "$prerelease" in
              alpha.*) npm_tag="alpha" ;;
              preview.*) npm_tag="preview" ;;
              rc.*) npm_tag="rc" ;;
              *) npm_tag="next" ;;
            esac
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup npm trusted publishing
        run: |
          npm install --global npm@^11.15.0
          npm config set registry https://registry.npmjs.org/
          node --version
          npm --version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate

      - name: Set package versions
        run: corepack pnpm version:set "${{ steps.version.outputs.version }}"

      - name: Restore .NET
        run: dotnet restore Cohesive.sln

      - name: Build .NET
        run: dotnet build Cohesive.sln -c Release --no-restore

      - name: Test .NET
        run: dotnet test Cohesive.sln -c Release --no-build

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build frontend packages
        run: corepack pnpm frontend:build

      - name: Test frontend packages
        run: corepack pnpm frontend:test

      - name: Pack npm packages
        run: |
          mkdir -p artifacts/npm
          corepack pnpm -r --filter '@cohesivesystems/*' pack --pack-destination artifacts/npm

      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts/nuget
          dotnet pack Cohesive.sln \
            -c Release \
            --no-build \
            -o artifacts/nuget \
            /p:PackageVersion="${{ steps.version.outputs.version }}"

      - name: Validate NuGet package APIs
        run: bash ./eng/api-check.sh

      - name: Test generic API package consumer
        env:
          COHESIVE_NUGET_LOCAL_FEED: ${{ github.workspace }}/artifacts/nuget
        run: bash ./eng/test-api-package-consumer.sh "${{ steps.version.outputs.version }}"

      - name: Test CLI package consumer
        env:
          COHESIVE_NUGET_LOCAL_FEED: ${{ github.workspace }}/artifacts/nuget
        run: bash ./eng/test-cli-package-consumer.sh "${{ steps.version.outputs.version }}"

      - name: Test simulation package family
        env:
          COHESIVE_NUGET_LOCAL_FEED: ${{ github.workspace }}/artifacts/nuget
        run: bash ./eng/test-simulation-tool.sh "${{ steps.version.outputs.version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/npm/*.tgz

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        run: |
          set -euo pipefail

          for package in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish npm packages
        run: |
          set -euo pipefail

          for package in artifacts/npm/*.tgz; do
            npm publish "$package" \
              --registry https://registry.npmjs.org/ \
              --access public \
              --tag "${{ steps.version.outputs.npm_tag }}"
          done
