name: cohesive-benchmarks

run-name: Cohesive benchmarks (${{ inputs.benchmark_job }}, ${{ inputs.benchmark_filter }})

on:
  workflow_dispatch:
    inputs:
      benchmark_job:
        description: BenchmarkDotNet job length
        required: true
        default: Dry
        type: choice
        options:
          - Dry
          - Short
          - Default
      benchmark_filter:
        description: BenchmarkDotNet filter
        required: true
        default: "*"
        type: string

permissions:
  contents: read

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: ordinal-benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COHESIVE_POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ordinal-benchmark


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmarks
        run: >-
          dotnet restore
          src/Cohesive.Relations.Benchmarks/Cohesive.Relations.Benchmarks.csproj

      - name: Build benchmarks
        run: >-
          dotnet build
          src/Cohesive.Relations.Benchmarks/Cohesive.Relations.Benchmarks.csproj
          -c Release --no-restore -warnaserror

      - name: Run benchmarks
        env:
          BENCHMARK_FILTER: ${{ inputs.benchmark_filter }}
          BENCHMARK_JOB: ${{ inputs.benchmark_job }}
        run: |
          # Generated harness builds traverse the project references again on CI runners.
          benchmark_args=(--filter "$BENCHMARK_FILTER" --buildTimeout 600)
          if [[ "$BENCHMARK_JOB" != "Default" ]]; then
            benchmark_args+=(--job "$BENCHMARK_JOB")
          fi

          dotnet run \
            --project src/Cohesive.Relations.Benchmarks/Cohesive.Relations.Benchmarks.csproj \
            -c Release --no-build -- \
            "${benchmark_args[@]}"

      - name: Upload BenchmarkDotNet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cohesive-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.benchmark_job }}
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: ignore
          retention-days: 14
